<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cricket Quiz</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="quiz-box">
<form id="quizForm">
    <div class="question">
        <h3>1. Who has the most centuries in international cricket?</h3>

        <label class="option"><input type="radio" name="q1" value="Sachin Tendulkar"> Sachin Tendulkar</label>
        <label class="option"><input type="radio" name="q1" value="Virat Kohli"> Virat Kohli</label>
        <label class="option"><input type="radio" name="q1" value="Ricky Ponting"> Ricky Ponting</label>
        <label class="option"><input type="radio" name="q1" value="Jacques Kallis"> Jacques Kallis</label>
    </div>

    <div class="question">
        <h3>2. Which country won the first ICC Cricket World Cup?</h3>

        <label class="option"><input type="radio" name="q2" value="Australia"> Australia</label>
        <label class="option"><input type="radio" name="q2" value="England"> England</label>
        <label class="option"><input type="radio" name="q2" value="West Indies"> West Indies</label>
        <label class="option"><input type="radio" name="q2" value="India"> India</label>
    </div>

    <div class="question">
        <h3>3. Who is known as the 'God of Cricket'?</h3>

        <label class="option"><input type="radio" name="q3" value="Virat Kohli"> Virat Kohli</label>
        <label class="option"><input type="radio" name="q3" value="Don Bradman"> Don Bradman</label>
        <label class="option"><input type="radio" name="q3" value="MS Dhoni"> MS Dhoni</label>
        <label class="option"><input type="radio" name="q3" value="Sachin Tendulkar"> Sachin Tendulkar</label>
    </div>

    <div class="question">
        <h3>4. What is the highest individual score in ODI cricket?</h3>

        <label class="option"><input type="radio" name="q4" value="264"> 264</label>
        <label class="option"><input type="radio" name="q4" value="200"> 200</label>
        <label class="option"><input type="radio" name="q4" value="237"> 237</label>
        <label class="option"><input type="radio" name="q4" value="275"> 275</label>
    </div>

    <div class="question">
        <h3>5. Which bowler has taken the most wickets in Test cricket?</h3>

        <label class="option"><input type="radio" name="q5" value="Muttiah Muralitharan"> Muttiah Muralitharan</label>
        <label class="option"><input type="radio" name="q5" value="Shane Warne"> Shane Warne</label>
        <label class="option"><input type="radio" name="q5" value="James Anderson"> James Anderson</label>
        <label class="option"><input type="radio" name="q5" value="Anil Kumble"> Anil Kumble</label>
    </div>
</form>

    <button id="btn">Submit</button>
    <div class="result"></div>

</div>

<script src="script.js"></script>
</body>

</html>
