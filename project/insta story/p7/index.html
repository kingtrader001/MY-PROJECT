<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astrology Prediction</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🔮 Astrology Prediction</h1>

    <div class="input-group">
        <label>Name</label>
        <input type="text" id="name" placeholder="Enter name">
    </div>

    <div class="input-group">
        <label>Surname</label>
        <input type="text" id="surname" placeholder="Enter surname">
    </div>

    <label>Date of Birth</label>

    <div class="dob">

        <input
        type="number"
        id="day"
        placeholder="Day"
        min="1"
        max="31">

        <input
        type="number"
        id="month"
        placeholder="Month"
        min="1"
        max="12">

        <input
        type="number"
        id="year"
        placeholder="Year">

    </div>

    <button id="btn">
        Get Prediction
    </button>

    <div id="result">

        <h3 id="userName">
            User Name
        </h3>

        <p id="prediction">
            Prediction Here...
        </p>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
